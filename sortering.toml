# sortering.toml — trädet som sorteringsförslagen följer.
#
# Den här filen är gjord för att ÄNDRAS. Reglerna är inte utlärda ur datan utan
# skrivna för hand; mätningen finns till för att säga hur de faktiskt träffar.
# Lägg till ord när du ser ett förslag bli fel, och kör `sortera.py --mat` för
# att se vad ändringen gjorde med hela arkivet.
#
# ORDNINGEN BETYDER NÅGOT. Grenarna prövas uppifrån och ner, och den gren vars
# ord dominerar vinner. Ordningen speglar Lars huvudintressen: det som kommer
# först får företräde när ett memo rör flera ämnen. Ett meta-memo nämner andra
# grenars kodord i förbigående ("...så ska den till wimber-vineyard") och måste
# därför ligga först.
#
# UPPMÄTT 2026-09-21 mot 286 sorterade transkript:
#   gren 2 hittas till 90 %, och inom den blir lövet rätt i 79 % av fallen
#   grennivån totalt 64 %; 7a saknar eget ordförråd och drar ner snittet
# Förslagen är alltså till för att godkännas, aldrig för att lita blint på.

# Ett memo som säger vad det handlar om avgör saken direkt, oavsett allt annat.
# Det är den disciplin som ska göra sorteringen tillförlitlig över tid: säg
# "Den här inspelningen handlar om NAR" i första meningen, så är det avgjort.
[uttalat]
inledning_sekunder = 45          # bara början av memot räknas
fraser = [
    "den här inspelningen handlar om",
    "det här memot handlar om",
    "den här inspelningen hör hemma i",
    "denna inspelning handlar om",
    "det här ska till",
    "sortera det här under",
]

# --------------------------------------------------------------------------- #
# Grenarna, i prioritetsordning
# --------------------------------------------------------------------------- #

